name: Update README with Userscript Info

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # 注册步骤需要 git diff $BEFORE..$GITHUB_SHA，浅克隆会 bad object

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate script list and update README
        run: |
          node .github/scripts/updateReadme.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update script list in README"
          git push

      - name: Register changed scripts to blog nav
        env:
          GH_TOKEN: ${{ secrets.BLOG_NAV_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git ls-files '*.user.js')"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- '*.user.js')"
          fi
          for f in $CHANGED; do
            [ -f "$f" ] || continue   # 已删除的脚本跳过；下线需手动删博客侧对应行
            jq -n --arg f "$f" '{event_type:"register-script",client_payload:{file:$f}}' \
              | gh api repos/Yiipu/yiipu.github.io/dispatches --input -
            echo "registered: $f"
          done
